<div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">

  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-3xl font-bold text-gray-800">Super Héroes</h1>
    <button mat-flat-button (click)="newHero()">
      <mat-icon>add</mat-icon>
      Nuevo héroe
    </button>
  </div>

  <div class="mb-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Buscar héroe</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Nombre o superhéroe...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="relative" [class.pointer-events-none]="isLoading()" [class.opacity-50]="isLoading()">

    @if (isLoading()) {
      <div class="absolute inset-0 z-10 flex items-center justify-center rounded-lg bg-white/60 backdrop-blur-sm">
        <mat-spinner diameter="48" />
      </div>
    }

    <div class="overflow-x-auto rounded-lg shadow-sm">
      <table mat-table [dataSource]="heroes()" class="w-full">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let hero">{{ hero.name }}</td>
        </ng-container>

        <ng-container matColumnDef="heroName">
          <th mat-header-cell *matHeaderCellDef>Super héroe</th>
          <td mat-cell *matCellDef="let hero" class="font-medium">{{ hero.heroName }}</td>
        </ng-container>

        <ng-container matColumnDef="power">
          <th mat-header-cell *matHeaderCellDef>Poder</th>
          <td mat-cell *matCellDef="let hero" class="text-sm text-gray-600">{{ hero.power }}</td>
        </ng-container>

        <ng-container matColumnDef="universe">
          <th mat-header-cell *matHeaderCellDef>Universo</th>
          <td mat-cell *matCellDef="let hero">{{ hero.universe }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="w-24">Acciones</th>
          <td mat-cell *matCellDef="let hero">
            <div class="flex items-center gap-1">
              <button mat-icon-button [attr.aria-label]="'Editar ' + hero.heroName" (click)="editHero(hero.id)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" [attr.aria-label]="'Eliminar ' + hero.heroName" (click)="deleteHero(hero)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="footer">
          <td mat-footer-cell *matFooterCellDef [attr.colspan]="displayedColumns.length" class="p-0">
            <div class="flex flex-wrap items-center justify-between gap-2">
              @if (totalPages > 1) {
                <div class="flex items-center gap-2 pl-4 text-sm ">
                  <label for="currentPage">Ir a página:</label>
                  <input
                    id="currentPage"
                    type="number"
                    min="1"
                    [max]="totalPages"
                    [value]="currentPage() + 1"
                    class="w-16 rounded border border-gray-300 px-2 py-1 text-center text-sm"
                    (change)="goToPage($event)">
                  <span>de {{ totalPages }}</span>
                </div>
              }
              <mat-paginator
                class="ml-auto"
                [length]="totalHeroes()"
                [pageSize]="pageSize"
                [pageSizeOptions]="pageSizeOptions"
                (page)="onPageChange($event)"
                showFirstLastButtons />
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50"></tr>
        <tr mat-footer-row *matFooterRowDef="['footer']"></tr>
      </table>
    </div>

    @if (!isLoading() && totalHeroes() === 0) {
      <p class="py-8 text-center text-gray-500">No se encontraron héroes.</p>
    }

  </div>

</div>
