<div class="hero-list-container">
  <h1>Super Héroes</h1>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar héroe</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Nombre o superhéroe...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  @if (isLoading()) {
    <div class="loading-wrapper">
      <mat-spinner diameter="48" />
      <p>Cargando héroes...</p>
    </div>
  } @else {
    <table mat-table [dataSource]="heroes()">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let hero">{{ hero.name }}</td>
      </ng-container>

      <ng-container matColumnDef="heroName">
        <th mat-header-cell *matHeaderCellDef>Superhéroe</th>
        <td mat-cell *matCellDef="let hero">{{ hero.heroName }}</td>
      </ng-container>

      <ng-container matColumnDef="power">
        <th mat-header-cell *matHeaderCellDef>Poder</th>
        <td mat-cell *matCellDef="let hero">{{ hero.power }}</td>
      </ng-container>

      <ng-container matColumnDef="universe">
        <th mat-header-cell *matHeaderCellDef>Universo</th>
        <td mat-cell *matCellDef="let hero">{{ hero.universe }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let hero">
          <button mat-icon-button>
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    @if (totalHeroes() === 0) {
      <p class="no-results">No se encontraron héroes.</p>
    }
  }

  <mat-paginator
    [length]="totalHeroes()"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageChange($event)"
    showFirstLastButtons />
</div>
